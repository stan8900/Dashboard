<!doctype html>
<html lang="en" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/branding/bold.svg"
      data-rh="true"
    />
    <link rel="apple-touch-icon" href="/images/branding/bold-192.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />

    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Bold — a modern open-source CRM" />
    <meta property="og:image" content="/images/branding/bold-512.png" />
    <meta property="og:description" content="Bold — a modern open-source CRM" />
    <meta property="og:title" content="Bold" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/images/branding/bold-512.png" />

    <meta
      name="twitter:description"
      content="Bold — a modern open-source CRM"
    />
    <meta name="twitter:title" content="Bold" />
    <title>Bold</title>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      /* react-data-grid declares its layer when it loads; keep it below twenty-ui. */
      @layer rdg, twenty-ui;

      :root {
        /* THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #1b1b1b;
        /* THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #fcfcfc;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
